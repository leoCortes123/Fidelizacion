<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Loopoint · Mockup Pixel-App Mobile-First (Admin, Encargado, Cliente)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="stylesheet" href="./pixel-design-system.css" />
  <style>
    /* ========================================================================
       LOOPOINT PIXEL-APP DESIGN SYSTEM
       Equilibrio entre estética de Aplicación Moderna + Gamificación Pixel Art.
       Diferenciación estricta entre:
       1. Títulos / Tarjetas informativas (planos, sin sombra dura)
       2. Campos de texto (hundidos con borde izquierdo azul e inner-shadow)
       3. Botones clicables (únicos elementos con bisel 3D y sombra sólida)
       ======================================================================== */
    :root {
      --app-bg: #f3f6fa;
      --app-surface: #ffffff;
      --app-surface-muted: #eef2f7;
      --app-border-static: #d5deeb;
      --app-border-strong: #0f172a;

      --app-ink: #0f172a;
      --app-ink-soft: #334155;
      --app-ink-muted: #64748b;

      --lp-primary: #2563eb;
      --lp-primary-hover: #1d4ed8;
      --lp-cyan: #06b6d4;
      --lp-cyan-dark: #0e7490;
      --lp-gold: #f59e0b;
      --lp-gold-soft: #fef3c7;
      --lp-emerald: #059669;
      --lp-emerald-soft: #d1fae5;

      --font-pixel: "Press Start 2P", ui-monospace, monospace;
      --font-mono: "DM Mono", ui-monospace, monospace;
      --font-sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;

      --touch-min: 48px;
      --touch-compact: 44px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: #0f172a;
      font-family: var(--font-sans);
      color: var(--app-ink);
      overflow-x: clip;
    }

    .lp-app-canvas {
      background-color: var(--app-bg);
      background-image: radial-gradient(rgba(15, 23, 42, 0.055) 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--app-ink);
    }

    .font-pixel {
      font-family: var(--font-pixel);
      line-height: 1.5;
    }

    .font-mono-code {
      font-family: var(--font-mono);
    }

    /* 1. PANELES Y TÍTULOS ESTÁTICOS (NO PARECEN BOTONES) */
    .lp-panel {
      background: var(--app-surface);
      border: 1.5px solid var(--app-border-static);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .lp-panel-muted {
      background: var(--app-surface-muted);
      border: 1.5px solid var(--app-border-static);
      border-radius: 6px;
    }

    .lp-panel-header {
      padding: 12px 16px;
      border-bottom: 1.5px solid var(--app-border-static);
      background: #f8fafc;
      border-radius: 7px 7px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Subtítulos/Kickers: solo texto con icono pixel, sin caja para no parecer clicable */
    .lp-section-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-pixel);
      font-size: 9px;
      color: var(--lp-cyan-dark);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Etiquetas de estado: planas y suaves, sin borde negro ni sombra */
    .lp-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
    }

    .lp-tag-cyan { background: #cffafe; color: #155e75; }
    .lp-tag-gold { background: var(--lp-gold-soft); color: #92400e; }
    .lp-tag-emerald { background: var(--lp-emerald-soft); color: #065f46; }
    .lp-tag-neutral { background: #e2e8f0; color: #334155; }

    /* 2. CAMPOS DE TEXTO / INPUTS (RELIEVE HUNDIDO CLARO Y FOCO VISIBLE) */
    .lp-field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--app-ink);
      margin-bottom: 5px;
    }

    .lp-input {
      width: 100%;
      min-height: var(--touch-min);
      padding: 10px 14px;
      background-color: #ffffff;
      border: 2px solid #64748b;
      border-left: 4px solid var(--lp-primary);
      border-radius: 5px;
      box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.08);
      font-family: var(--font-sans);
      font-size: 16px; /* Previene auto-zoom en móviles */
      font-weight: 600;
      color: var(--app-ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .lp-input:hover:not(:disabled) {
      border-color: var(--app-ink);
      border-left-color: var(--lp-primary);
    }

    .lp-input:focus {
      outline: none;
      border-color: var(--lp-primary);
      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.22),
        inset 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .lp-input:disabled {
      background-color: #e2e8f0;
      border-color: #cbd5e1;
      border-left-color: #94a3b8;
      color: #64748b;
      box-shadow: none;
    }

    /* 3. BOTONES CLICABLES (ÚNICOS ELEMENTOS CON BISEL 3D Y SOMBRA PIXEL SÓLIDA) */
    .lp-btn {
      min-height: var(--touch-min);
      padding: 10px 18px;
      border: 2px solid var(--app-border-strong);
      border-radius: 5px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.32),
        0 3px 0 var(--app-border-strong);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.12s ease;
    }

    .lp-btn-sm {
      min-height: var(--touch-compact);
      padding: 7px 13px;
      font-size: 13px;
    }

    .lp-btn:hover {
      transform: translateY(-1px);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.42),
        0 4px 0 var(--app-border-strong);
    }

    .lp-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .lp-btn-primary { background-color: var(--lp-primary); color: #ffffff; }
    .lp-btn-primary:hover { background-color: var(--lp-primary-hover); }
    .lp-btn-emerald { background-color: var(--lp-emerald); color: #ffffff; }
    .lp-btn-secondary { background-color: #ffffff; color: var(--app-ink); }
    .lp-btn-secondary:hover { background-color: #f8fafc; }
    .lp-btn-dark { background-color: var(--app-ink); color: #ffffff; }

    /* 4. ELEMENTOS GAMIFICADOS PIXEL (BARRAS DE PROGRESO Y CONTADORES) */
    .lp-progress {
      height: 16px;
      border: 2px solid var(--app-border-strong);
      border-radius: 3px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .lp-progress-bar {
      height: 100%;
      background: repeating-linear-gradient(
        to right,
        var(--lp-cyan) 0px,
        var(--lp-cyan) 12px,
        #0891b2 12px,
        #0891b2 15px
      );
      border-right: 2px solid var(--app-border-strong);
      transition: width 0.25s steps(8, end);
    }

    .lp-progress-bar.bar-gold {
      background: repeating-linear-gradient(
        to right,
        var(--lp-gold) 0px,
        var(--lp-gold) 12px,
        #d97706 12px,
        #d97706 15px
      );
    }

    .qr-pattern {
      background-color: #ffffff;
      background-image:
        conic-gradient(#0f172a 25%, transparent 0 50%, #0f172a 0 75%, transparent 0),
        conic-gradient(#0f172a 25%, transparent 0 50%, #0f172a 0 75%, transparent 0);
      background-position: 0 0, 8px 8px;
      background-size: 16px 16px;
    }

    .lp-snap-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }

    .lp-snap-row > * {
      scroll-snap-align: start;
      flex-shrink: 0;
    }

    .lp-bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 40;
      background: #ffffff;
      border-top: 2px solid var(--app-border-strong);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Simulador de Viewport */
    .device-frame-mobile {
      max-width: 412px;
      margin: 16px auto 32px;
      border: 6px solid #1e293b;
      box-shadow: 0 0 0 2px #06b6d4, 0 20px 40px rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      overflow: hidden;
    }

    .device-frame-tablet {
      max-width: 780px;
      margin: 16px auto 32px;
      border: 6px solid #1e293b;
      box-shadow: 0 0 0 2px #2563eb, 0 20px 40px rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      overflow: hidden;
    }

    .device-frame-full { width: 100%; }

    /* ========================================================================
       ESTILOS ORIGINALES DE LA LANDING PAGE DE LA APLICACIÓN (.retro-landing)
       Copia fiel de fidelizacionWeb/src/features/auth/LandingPage.css
       ======================================================================== */
    .retro-landing {
      --ink: #1e1c1a;
      --paper: #f6edda;
      --paper-deep: #eadec5;
      --cream: #fffdf5;
      --red: #e6533f;
      --orange: #f2a541;
      --gold: #ffd166;
      --green: #4e8c57;
      --green-bright: #34d399;
      --blue: #467299;
      --cyan: #22d3ee;
      background-color: var(--paper);
      background-image:
        radial-gradient(rgba(30, 28, 26, 0.13) 0.75px, transparent 0.75px),
        linear-gradient(to right, rgba(30, 28, 26, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(30, 28, 26, 0.035) 1px, transparent 1px);
      background-size: 6px 6px, 24px 24px, 24px 24px;
      color: var(--ink);
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    }
    .retro-landing .wrap { max-width: 1180px; margin: auto; padding: 0 24px; }
    .retro-landing .btn {
      border: 3px solid var(--ink);
      padding: 12px 18px;
      font: 600 13px "DM Mono", monospace;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.4), 4px 4px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .retro-landing .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
    .retro-landing .btn-dark { background: var(--ink); color: var(--cream); box-shadow: 4px 4px 0 var(--red); }
    .retro-landing .btn-red { background: var(--red); color: white; }
    .retro-landing .btn-light { background: var(--cream); color: var(--ink); }
  </style>
</head>
<body>

  <!-- =========================================================================
       BARRA SUPERIOR GLOBAL DEL MOCKUP: SELECTOR DE ROL, FLUJO Y DISPOSITIVO
  ========================================================================== -->
  <header class="sticky top-0 z-50 border-b border-slate-700 bg-slate-900 text-white">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-2 px-3 py-2.5 sm:px-5">
      <div class="flex items-center gap-2.5">
        <div class="grid h-9 w-9 shrink-0 place-items-center rounded border-2 border-cyan-400 bg-slate-950">
          <svg viewBox="0 0 16 16" class="h-6 w-6" shape-rendering="crispEdges" aria-hidden="true">
            <rect x="5" y="1" width="6" height="1" fill="#083344"/>
            <rect x="3" y="2" width="10" height="1" fill="#06b6d4"/>
            <rect x="2" y="3" width="12" height="10" fill="#22d3ee"/>
            <rect x="3" y="13" width="10" height="1" fill="#06b6d4"/>
            <rect x="5" y="14" width="6" height="1" fill="#083344"/>
            <rect x="4" y="3" width="8" height="1" fill="#a5f3fc"/>
            <rect x="6" y="5" width="2" height="6" fill="#facc15"/>
            <rect x="6" y="9" width="5" height="2" fill="#facc15"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm tracking-tight text-white">Loopoint · Mockup Pixel-App</span>
            <span class="rounded bg-cyan-500/20 border border-cyan-400/30 px-2 py-0.5 font-mono-code text-xs text-cyan-300">
              Affordance & Mobile-First
            </span>
          </div>
          <p class="hidden sm:block text-xs text-slate-400">
            Estética de aplicación con gamificación pixel art · Inputs y botones diferenciados de títulos
          </p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <!-- Selector de Rol -->
        <div class="flex items-center rounded-md border border-slate-700 bg-slate-800 p-1 gap-1" role="tablist" aria-label="Selector de rol">
          <button
            type="button"
            onclick="setRole('admin')"
            id="role-btn-admin"
            class="rounded px-2.5 py-1.5 font-mono-code text-xs font-bold transition-all bg-blue-600 text-white"
          >
            1. Administrador
          </button>
          <button
            type="button"
            onclick="setRole('encargado')"
            id="role-btn-encargado"
            class="rounded px-2.5 py-1.5 font-mono-code text-xs font-bold transition-all text-slate-300 hover:text-white"
          >
            2. Encargado
          </button>
          <button
            type="button"
            onclick="setRole('cliente')"
            id="role-btn-cliente"
            class="rounded px-2.5 py-1.5 font-mono-code text-xs font-bold transition-all text-slate-300 hover:text-white"
          >
            3. Cliente
          </button>
        </div>

        <!-- Selector de Viewport -->
        <div class="hidden md:flex items-center rounded-md border border-slate-700 bg-slate-800 p-1 gap-1">
          <button
            type="button"
            onclick="setViewport('mobile')"
            id="vp-btn-mobile"
            class="rounded px-2.5 py-1.5 font-mono-code text-xs font-bold text-slate-300 hover:text-white"
          >
            📱 Móvil (390px)
          </button>
          <button
            type="button"
            onclick="setViewport('tablet')"
            id="vp-btn-tablet"
            class="rounded px-2.5 py-1.5 font-mono-code text-xs font-bold text-slate-300 hover:text-white"
          >
            📲 Tablet
          </button>
          <button
            type="button"
            onclick="setViewport('full')"
            id="vp-btn-full"
            class="rounded px-2.5 py-1.5 font-mono-code text-xs font-bold bg-cyan-400 text-slate-950"
          >
            🖥️ Adaptativo
          </button>
        </div>

        <button
          type="button"
          onclick="openSpecsModal()"
          class="rounded-md border border-cyan-400/50 bg-slate-800 px-2.5 py-1.5 font-mono-code text-xs font-bold text-cyan-300 hover:bg-cyan-400 hover:text-slate-950"
        >
          📐 Guía Visual
        </button>
      </div>
    </div>

    <!-- Sub-barra del Flujo de Administrador -->
    <div id="admin-flow-bar" class="border-t border-slate-800 bg-slate-950 px-3 py-2 sm:px-5">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 overflow-x-auto">
        <div class="flex items-center gap-1.5 shrink-0">
          <span class="font-mono-code text-xs text-cyan-400 font-bold mr-1">Vista Admin:</span>
          <button onclick="setAdminStage('landing')" id="stage-btn-landing" class="rounded px-2.5 py-1 font-mono-code text-xs font-bold text-slate-300 hover:bg-slate-800">
            A. Landing (Original)
          </button>
          <span class="text-slate-600">→</span>
          <button onclick="setAdminStage('auth')" id="stage-btn-auth" class="rounded px-2.5 py-1 font-mono-code text-xs font-bold text-slate-300 hover:bg-slate-800">
            B. Login / Registro
          </button>
          <span class="text-slate-600">→</span>
          <button onclick="setAdminStage('onboarding')" id="stage-btn-onboarding" class="rounded px-2.5 py-1 font-mono-code text-xs font-bold text-slate-300 hover:bg-slate-800">
            C. Onboarding (3 pasos)
          </button>
          <span class="text-slate-600">→</span>
          <button onclick="setAdminStage('app')" id="stage-btn-app" class="rounded px-2.5 py-1 font-mono-code text-xs font-bold bg-cyan-400 text-slate-950">
            D. Panel Aplicación
          </button>
        </div>
        <span class="hidden lg:inline-block font-mono-code text-xs text-slate-400 shrink-0">
          Títulos planos · Inputs con borde izquierdo azul e inner-shadow · Botones con relieve 3D
        </span>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <div id="device-wrapper" class="device-frame-full">
    <div id="viewport-container" class="lp-app-canvas min-h-[calc(100dvh-90px)]"></div>
  </div>

  <!-- MODAL REUTILIZABLE -->
  <div id="mockup-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-950/75 p-0 sm:p-4 backdrop-blur-xs">
    <div class="lp-panel w-full max-w-lg max-h-[90dvh] overflow-y-auto shadow-2xl border-2 border-slate-900">
      <div class="lp-panel-header bg-slate-900 text-white rounded-none">
        <span id="modal-title" class="font-bold text-sm">Detalle</span>
        <button onclick="closeModal()" class="rounded bg-slate-800 px-2.5 py-1 text-xs font-bold text-slate-200 hover:bg-slate-700">
          ✕
        </button>
      </div>
      <div id="modal-body" class="p-5 text-sm"></div>
      <div class="border-t border-slate-200 bg-slate-50 px-5 py-3 flex justify-end">
        <button onclick="closeModal()" class="lp-btn lp-btn-sm lp-btn-secondary">
          Cerrar
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ICONOS PIXEL ART EN SVG (CRISP EDGES)
    // =========================================================================
    const PIXEL_ICONS = {
      coin: `<svg viewBox="0 0 16 16" class="w-5 h-5 inline-block shrink-0" shape-rendering="crispEdges"><rect x="5" y="1" width="6" height="1" fill="#083344"/><rect x="3" y="2" width="10" height="1" fill="#06b6d4"/><rect x="2" y="3" width="12" height="10" fill="#22d3ee"/><rect x="3" y="13" width="10" height="1" fill="#06b6d4"/><rect x="5" y="14" width="6" height="1" fill="#083344"/><rect x="4" y="3" width="8" height="1" fill="#a5f3fc"/><rect x="6" y="5" width="2" height="6" fill="#facc15"/><rect x="6" y="9" width="5" height="2" fill="#facc15"/></svg>`,
      coinLg: `<svg viewBox="0 0 16 16" class="w-9 h-9 inline-block shrink-0" shape-rendering="crispEdges"><rect x="5" y="1" width="6" height="1" fill="#083344"/><rect x="3" y="2" width="10" height="1" fill="#06b6d4"/><rect x="2" y="3" width="12" height="10" fill="#22d3ee"/><rect x="3" y="13" width="10" height="1" fill="#06b6d4"/><rect x="5" y="14" width="6" height="1" fill="#083344"/><rect x="4" y="3" width="8" height="1" fill="#a5f3fc"/><rect x="6" y="5" width="2" height="6" fill="#facc15"/><rect x="6" y="9" width="5" height="2" fill="#facc15"/></svg>`,
      qr: `<svg viewBox="0 0 16 16" class="w-5 h-5 inline-block shrink-0" shape-rendering="crispEdges"><path fill="currentColor" d="M1 1h6v6H1V1zm1 1v4h4V2H2zm1 1h2v2H3V3zm6-2h6v6H9V1zm1 1v4h4V2h-4zm1 1h2v2h-2V3zM1 9h6v6H1V9zm1 1v4h4v-4H2zm1 1h2v2H3v-2zm8-1h2v2h-2V9zm4 0h2v2h-2V9zm-2 2h2v2h-2v-2zm-2 2h2v2H9v-2zm4 0h2v2h-2v-2z"/><rect x="0" y="7" width="16" height="2" fill="#2563eb"/></svg>`,

    function setRole(role) {
      state.role = role;
      ['admin', 'encargado', 'cliente'].forEach((r) => {
        const btn = document.getElementById('role-btn-' + r);
        if (!btn) return;
        btn.className = r === role
          ? 'rounded px-2.5 py-1.5 font-mono-code text-xs font-bold transition-all bg-blue-600 text-white'
          : 'rounded px-2.5 py-1.5 font-mono-code text-xs font-bold transition-all text-slate-300 hover:text-white';
      });
      document.getElementById('admin-flow-bar').style.display = role === 'admin' ? 'block' : 'none';
      render();
    }

    function setViewport(vp) {
      state.viewport = vp;
      const wrapper = document.getElementById('device-wrapper');
      wrapper.className = vp === 'mobile'
        ? 'device-frame-mobile'
        : vp === 'tablet'
          ? 'device-frame-tablet'
          : 'device-frame-full';

      ['mobile', 'tablet', 'full'].forEach((v) => {
        const btn = document.getElementById('vp-btn-' + v);
        if (!btn) return;
        btn.className = v === vp
          ? 'rounded px-2.5 py-1.5 font-mono-code text-xs font-bold bg-cyan-400 text-slate-950'
          : 'rounded px-2.5 py-1.5 font-mono-code text-xs font-bold text-slate-300 hover:text-white';
      });
      render();
    }

    function setAdminStage(stage) {
      state.adminStage = stage;
      ['landing', 'auth', 'onboarding', 'app'].forEach((s) => {
        const btn = document.getElementById('stage-btn-' + s);
        if (!btn) return;
        btn.className = s === stage
          ? 'rounded px-2.5 py-1 font-mono-code text-xs font-bold bg-cyan-400 text-slate-950'
          : 'rounded px-2.5 py-1 font-mono-code text-xs font-bold text-slate-300 hover:bg-slate-800';
      });
      render();
    }

    function setAdminNav(nav, profileTab) {
      state.adminNav = nav;

    function openModal(title, htmlContent) {

      modal.classList.add('flex');

                  <p class="text-xs text-slate-400">${biz.category} · @${biz.slug}</p>
                </div>
                <div class="text-left sm:text-right">
                  <span class="font-pixel text-[8px] text-cyan-300">TUS LOOPOINTS AQUÍ</span>
                  <div class="mt-1 flex items-center gap-2">
                    ${PIXEL_ICONS.coinLg}
                    <span class="font-pixel text-2xl sm:text-3xl text-amber-300">${biz.balance} PTS</span>
                  </div>
                  <p class="font-mono-code text-xs text-slate-400 mt-1">${biz.nextExpiry}</p>
                </div>
              </div>

              <!-- Reto de Frecuencia Mensual con Barra Pixel -->
              <div class="rounded-lg bg-slate-800 p-3.5 space-y-2 border border-slate-700">
                <div class="flex justify-between font-mono-code text-xs font-semibold">
                  <span class="text-slate-200"> Meta Cliente Frecuente (Mes actual)</span>
                  <span class="text-amber-300">${biz.visitsThisMonth} / ${biz.visitsTarget} visitas</span>
                </div>
                <div class="lp-progress">
                  <div class="lp-progress-bar bar-gold" style="width: ${Math.min(100, (biz.visitsThisMonth / biz.visitsTarget) * 100)}%"></div>
                </div>
              </div>
            </div>

            <!-- VOUCHER DE CANJE ACTIVO -->
            ${biz.activeVoucher ? `
              <div class="lp-panel p-4 border-l-4 border-l-emerald-500 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <div class="h-12 w-12 qr-pattern rounded border border-slate-900 shrink-0"></div>
                  <div>
                    <span class="lp-tag lp-tag-emerald">Canje listo para mostrar en caja</span>
                    <p class="mt-0.5 font-extrabold text-sm text-slate-900">${biz.activeVoucher.reward}</p>
                    <p class="font-mono-code text-xs text-slate-500">Código: <strong>${biz.activeVoucher.code}</strong> · Vence en ${biz.activeVoucher.expires}</p>
                  </div>
                </div>
                <button
                  onclick="openModal('QR de Canje para Caja', '<div class=\\'text-center space-y-3\\'><div class=\\'mx-auto h-44 w-44 qr-pattern rounded border-2 border-slate-900\\'></div><p class=\\'font-pixel text-sm text-blue-600\\'>${biz.activeVoucher.code}</p><p class=\\'text-xs text-slate-600\\'>Muéstrale este código al encargado de ${biz.name}.</p></div>')"
                  class="lp-btn lp-btn-sm lp-btn-emerald w-full sm:w-auto"
                >
                  Ver QR grande →
                </button>
              </div>
            ` : ''}

            <!-- CATÁLOGO DE RECOMPENSAS (TÍTULOS PLANOS + BOTÓN DE CANJE RESALTADO) -->
            <div class="space-y-3">
              <div class="flex items-center justify-between">
                <div>
                  <span class="lp-section-kicker">${PIXEL_ICONS.gift} PREMIOS DESBLOQUEABLES</span>
                  <h2 class="text-lg font-extrabold text-slate-900">Recompensas en ${biz.name}</h2>
                </div>
                <span class="lp-tag lp-tag-emerald">${biz.rewards.filter(r => r.canRedeem).length} disponibles</span>
              </div>

              <div class="grid gap-4 sm:grid-cols-2">
                ${biz.rewards.map(r => {
                  const pct = Math.min(100, Math.floor((biz.balance / r.pts) * 100));
                  return `
                    <div class="lp-panel p-4 flex flex-col justify-between gap-3.5">
                      <div class="space-y-1">
                        <div class="flex items-start justify-between gap-2">
                          <h3 class="font-bold text-sm text-slate-900">${r.name}</h3>
                          <span class="lp-tag ${r.canRedeem ? 'lp-tag-emerald' : 'lp-tag-neutral'} shrink-0 font-pixel text-[8px]">${r.pts} PTS</span>
                        </div>
                        <p class="text-xs text-slate-500">${r.desc}</p>
                      </div>

                      <div class="space-y-2.5">
                        <div class="lp-progress">
                          <div class="lp-progress-bar ${r.canRedeem ? '' : 'bar-gold'}" style="width: ${pct}%"></div>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                          <span class="font-mono-code text-xs text-slate-500">
                            ${r.canRedeem ? '✓ Puntos suficientes' : `Te faltan ${r.pts - biz.balance} pts`}
                          </span>
                          ${r.canRedeem ? `
                            <button
                              onclick="openModal('Solicitar Recompensa', '<div class=\\'text-center space-y-3\\'><p class=\\'text-xs text-slate-600\\'>Se reservarán <strong>${r.pts} loopoints</strong> en ${biz.name}:</p><div class=\\'mx-auto h-36 w-36 qr-pattern rounded border-2 border-slate-900\\'></div><p class=\\'font-pixel text-xs text-emerald-700\\'>QR GENERADO · LP-NEW9</p></div>')"
                              class="lp-btn lp-btn-sm lp-btn-primary"
                            >
                              Canjear con QR
                            </button>
                          ` : `
                            <span class="lp-tag lp-tag-neutral">Por desbloquear</span>
                          `}
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- HISTORIAL DE MOVIMIENTOS -->
            <div class="lp-panel overflow-hidden">
              <div class="lp-panel-header">
                <h2 class="font-bold text-sm text-slate-900">Historial de puntos en ${biz.name}</h2>
                <span class="lp-tag lp-tag-neutral">Recientes</span>
              </div>
              <div class="p-4 divide-y divide-slate-100">
                ${biz.movements.map(m => `
                  <div class="py-2.5 flex items-center justify-between gap-2">
                    <div>
                      <p class="font-bold text-xs sm:text-sm text-slate-900">${m.title}</p>
                      <p class="text-xs text-slate-500">${m.detail} · ${m.date}</p>
                    </div>
                    <span class="lp-tag ${m.pts.startsWith('+') ? 'lp-tag-emerald' : 'lp-tag-gold'} font-pixel text-[8px]">${m.pts} PTS</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- BARRA INFERIOR MÓVIL DEL CLIENTE -->
          <nav class="lp-bottom-nav grid grid-cols-4 max-w-3xl mx-auto border-x border-slate-200" aria-label="Navegación móvil del cliente">
            <button onclick="state.clienteTab='billetera'; render()" class="min-h-[60px] flex flex-col items-center justify-center gap-1 text-xs font-bold text-blue-600 bg-blue-50/50">
              <span>🪙</span>
              <span>Billetera</span>
            </button>
            <button onclick="openModal('Mis Canjes', '<p class=\\'text-xs text-slate-600\\'>Consulta tus códigos QR pendientes de entrega y el historial de premios reclamados.</p>')" class="min-h-[60px] flex flex-col items-center justify-center gap-1 text-xs font-bold text-slate-600">
              <span>🎟️</span>
              <span>Mis Canjes</span>
            </button>
            <button onclick="openModal('Mis Compras', '<p class=\\'text-xs text-slate-600\\'>Listado de compras reclamadas con sus productos y loopoints sumados.</p>')" class="min-h-[60px] flex flex-col items-center justify-center gap-1 text-xs font-bold text-slate-600">
              <span>🧾</span>
              <span>Compras</span>
            </button>
            <button onclick="openModal('Mi Perfil', '<p class=\\'text-xs text-slate-600\\'>Edita tu nombre y tu @alias público en Loopoint.</p>')" class="min-h-[60px] flex flex-col items-center justify-center gap-1 text-xs font-bold text-slate-600">
              <span>👤</span>
              <span>Mi Perfil</span>
            </button>
          </nav>
        </div>
      `;
    }

    // =========================================================================
    // RENDERIZADO PRINCIPAL
    // =========================================================================
    function render() {
      const container = document.getElementById('viewport-container');
      if (state.role === 'admin') {
        if (state.adminStage === 'landing') container.innerHTML = renderLandingView();
        else if (state.adminStage === 'auth') container.innerHTML = renderAuthView();
        else if (state.adminStage === 'onboarding') container.innerHTML = renderOnboardingView();
        else container.innerHTML = renderAdminApp();
      } else if (state.role === 'encargado') {
        container.innerHTML = renderEncargadoView();
      } else {
        container.innerHTML = renderClienteView();
      }
    }

    render();
  </script>
</body>
</html>
