<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f6edda;
        --ink: #1e1c1a;
        --red: #e6533f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>

      <div id="caja" data-composition-id="caja" data-composition-src="compositions/caja.html"
        data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="reclamo" data-composition-id="reclamo" data-composition-src="compositions/reclamo.html"
        data-start="6" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="saldo" data-composition-id="saldo" data-composition-src="compositions/saldo.html"
        data-start="12" data-duration="7.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="canje" data-composition-id="canje" data-composition-src="compositions/canje.html"
        data-start="19.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="final" data-composition-id="final" data-composition-src="compositions/final.html"
        data-start="25" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 5"></div>

      <!-- SFX (Pixabay, bundled with the HyperFrames media-use skill) -->
      <audio id="sfx-ping-qr" class="clip" src="assets/sfx/ping.mp3" data-start="2.05" data-media-start="0.28" data-duration="0.9" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-pop-born" class="clip" src="assets/sfx/pop.mp3" data-start="2.88" data-duration="0.7" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-whoosh-leap" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.82" data-duration="0.57" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-whoosh-zoom" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="5.15" data-media-start="1.65" data-duration="1.5" data-track-index="13" data-volume="0.7"></audio>

      <audio id="sfx-pop-cell" class="clip" src="assets/sfx/pop.mp3" data-start="6.45" data-duration="0.7" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-click-confirm" class="clip" src="assets/sfx/click.mp3" data-start="7.84" data-duration="0.36" data-track-index="11" data-volume="0.9"></audio>
      <audio id="sfx-chime-credit" class="clip" src="assets/sfx/chime.mp3" data-start="8.12" data-media-start="0.35" data-duration="2.0" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-whoosh-out" class="clip" src="assets/sfx/whoosh.mp3" data-start="11.22" data-duration="0.57" data-track-index="13" data-volume="0.55"></audio>

      <audio id="sfx-pop-v1" class="clip" src="assets/sfx/pop.mp3" data-start="12.88" data-duration="0.7" data-track-index="10" data-volume="0.75"></audio>
      <audio id="sfx-pop-v2" class="clip" src="assets/sfx/pop.mp3" data-start="15.08" data-duration="0.7" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-pop-v3" class="clip" src="assets/sfx/pop.mp3" data-start="16.58" data-duration="0.7" data-track-index="10" data-volume="0.85"></audio>
      <audio id="sfx-ready" class="clip" src="assets/sfx/notification.mp3" data-start="16.92" data-duration="1.8" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-click-redeem" class="clip" src="assets/sfx/click.mp3" data-start="18.34" data-duration="0.36" data-track-index="11" data-volume="0.9"></audio>
      <audio id="sfx-whoosh-flood" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="18.45" data-duration="0.57" data-track-index="13" data-volume="0.6"></audio>

      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="18.12" data-media-start="1.0" data-duration="2.5" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-impact-cup" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="20.55" data-duration="2.1" data-track-index="10" data-volume="0.9"></audio>
      <audio id="sfx-stamp" class="clip" src="assets/sfx/click.mp3" data-start="22.66" data-duration="0.36" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-whoosh-wipe" class="clip" src="assets/sfx/whoosh.mp3" data-start="24.22" data-duration="0.57" data-track-index="13" data-volume="0.5"></audio>

      <audio id="sfx-sparkle-mark" class="clip" src="assets/sfx/sparkle.mp3" data-start="27.78" data-duration="1.8" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-pop-cta" class="clip" src="assets/sfx/pop.mp3" data-start="28.12" data-duration="0.7" data-track-index="10" data-volume="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
