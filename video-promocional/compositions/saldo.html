  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const words = gsap.utils.toArray("#s-copy .w");
      const ptsEl = document.getElementById("s-points-val");
      const capEl = document.getElementById("s-progress-caption");
      const remEl = document.getElementById("s-progress-rem");
      const pctEl = document.getElementById("s-progress-pct");
      const pillEl = document.getElementById("s-level-pill");
      const tagEl = document.getElementById("s-reward-tag");

      function fmtNum(n) {
        return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      }

      // Función determinista de saldo según tiempo de timeline
      function syncMetrics(t) {
        let pts = 1100;
        let pct = 55;
        if (t >= 0.95 && t < 3.15) {
          const p = Math.min(1, (t - 0.95) / 0.35);
          const s = Math.floor(p * 6) / 6;
          pts = 1100 + 150 * (p >= 1 ? 1 : s);
          pct = 55 + 8 * (p >= 1 ? 1 : s);
        } else if (t >= 3.15 && t < 4.65) {
          const p = Math.min(1, (t - 3.15) / 0.35);
          const s = Math.floor(p * 6) / 6;
          pts = 1250 + 350 * (p >= 1 ? 1 : s);
          pct = 63 + 17 * (p >= 1 ? 1 : s);
        } else if (t >= 4.65) {
          const p = Math.min(1, (t - 4.65) / 0.35);
          const s = Math.floor(p * 6) / 6;
          pts = 1600 + 400 * (p >= 1 ? 1 : s);
          pct = 80 + 20 * (p >= 1 ? 1 : s);
        }
        const roundedPts = Math.round(pts);
        const roundedPct = Math.round(pct);
        ptsEl.textContent = fmtNum(roundedPts) + " PTS";
        pctEl.textContent = roundedPct + "%";

        if (t >= 4.96) {
          pillEl.textContent = "PREMIO LISTO";
          pillEl.style.background = "#34d399";
          capEl.textContent = "¡TIENES UN PREMIO LISTO PARA RECLAMAR!";
          remEl.textContent = "LISTO PARA CANJEAR EN CAJA";
          tagEl.textContent = "LISTO PARA CANJEAR";
        } else {
          pillEl.textContent = "JUGADOR ACTIVO";
          pillEl.style.background = "#ffd166";
          capEl.textContent = "¡ESTÁS CERCA DE TU PRÓXIMO PREMIO!";
          remEl.textContent = "FALTAN " + fmtNum(Math.max(0, 2000 - roundedPts)) + " PTS PARA CAFÉ GRATIS";
          tagEl.textContent = "PRÓXIMO CANJE";
        }
      }

      tl.eventCallback("onUpdate", function () {
        syncMetrics(tl.time());
      });
      syncMetrics(0);

      // PLAYER CARD entra desde la derecha; título entra por palabra
      tl.fromTo("#s-window", { x: 1050 }, { x: 0, duration: 0.65, ease: "expo.out" }, 0);
      tl.fromTo(words, { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.08, ease: "power2.out" }, 0.12);
      tl.fromTo("#s-progress-fill", { scaleX: 0.55 }, { scaleX: 0.55, duration: 0.01 }, 0);

      // Visita 1 (+150 -> 1.250 PTS) — moneda aterriza a 0.95s (sfx-pop-v1 a 0.98s)
      tl.fromTo("#s-coin1", { x: -960, y: -220, scale: 1.5, rotation: -20 },
        { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.55, ease: "power2.in" }, 0.4);
      tl.to("#s-main-coin", { scaleY: 0.78, scaleX: 1.18, duration: 0.08, ease: "power2.out", transformOrigin: "50% 100%" }, 0.95);
      tl.to("#s-main-coin", { scaleY: 1, scaleX: 1, duration: 0.25, ease: "back.out(2)", transformOrigin: "50% 100%" }, 1.03);
      tl.fromTo("#s-v1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.95);
      tl.to("#s-progress-fill", { scaleX: 0.63, duration: 0.35, ease: "steps(6)" }, 0.95);

      // Visita 2 (+350 -> 1.600 PTS) — moneda aterriza a 3.15s (sfx-pop-v2 a 3.18s)
      tl.fromTo("#s-coin2", { x: -720, y: -380, scale: 1.4, rotation: 24 },
        { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.55, ease: "power2.in" }, 2.6);
      tl.to("#s-main-coin", { scaleY: 0.78, scaleX: 1.18, duration: 0.08, ease: "power2.out", transformOrigin: "50% 100%" }, 3.15);
      tl.to("#s-main-coin", { scaleY: 1, scaleX: 1, duration: 0.25, ease: "back.out(2)", transformOrigin: "50% 100%" }, 3.23);
      tl.fromTo("#s-v2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 3.15);
      tl.to("#s-progress-fill", { scaleX: 0.80, duration: 0.35, ease: "steps(6)" }, 3.15);

      // Visita 3 (+400 -> 2.000 PTS, 100%) — moneda aterriza a 4.65s (sfx-pop-v3 a 4.68s)
      tl.fromTo("#s-coin3", { x: -560, y: -420, scale: 1.5, rotation: -30 },
        { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.55, ease: "power2.in" }, 4.1);
      tl.to("#s-main-coin", { scaleY: 0.72, scaleX: 1.24, duration: 0.09, ease: "power2.out", transformOrigin: "50% 100%" }, 4.65);
      tl.to("#s-main-coin", { scaleY: 1, scaleX: 1, duration: 0.32, ease: "back.out(2.2)", transformOrigin: "50% 100%" }, 4.74);
      tl.fromTo("#s-v3", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 4.65);
      tl.to("#s-progress-fill", { scaleX: 1.0, duration: 0.35, ease: "steps(6)" }, 4.65);

      // PREMIO LISTO (t=4.96s -> sfx-ready a 5.0s)
      tl.to("#s-level-pill", { scale: 1.12, duration: 0.16, ease: "back.out(2)" }, 4.96);
      tl.to("#s-level-pill", { scale: 1, duration: 0.2, ease: "power2.out" }, 5.12);
      tl.to("#s-icon-gift", { opacity: 0, scale: 0.6, duration: 0.14 }, 4.96);
      tl.fromTo("#s-icon-trophy", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.4)" }, 5.02);
