  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const words = gsap.utils.toArray("#r-copy .w");

      // Título por palabra (blur 6 -> 0, sin translate)

        { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, 0.15);
      tl.fromTo(".r-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.05);
      tl.fromTo(".r-sub", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.6);

      // Moneda cae desde arriba sobre la celda +150 (aterriza a t=0.52s -> sfx-pop-cell a 0.55s)

        { y: -560, x: 30, scale: 1.8, rotation: -18 },
        { y: 0, x: 0, scale: 1, rotation: 0, duration: 0.52, ease: "power3.in" },
        0.05
      );
      tl.to("#r-coin", { scaleY: 0.76, scaleX: 1.18, y: 12, duration: 0.1, ease: "power2.out", transformOrigin: "50% 100%" }, 0.57);
      tl.to("#r-coin", { scaleY: 1, scaleX: 1, y: 0, duration: 0.35, ease: "back.out(2.2)", transformOrigin: "50% 100%" }, 0.67);

      // Cursor grande entra y hace clic en "Confirmar y sumar loopoints" (clic a t=1.87s -> sfx-click-confirm a 1.9s)
      tl.fromTo("#r-cursor", { x: 280, y: 260, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 1.25);
      tl.to("#r-cursor", { scale: 0.82, y: 8, duration: 0.08, ease: "power2.in", transformOrigin: "20% 10%" }, 1.84);
      tl.to("#r-confirm-btn", { y: 4, scale: 0.97, duration: 0.08, ease: "power2.in" }, 1.84);
      tl.to("#r-cursor", { scale: 1, y: 0, opacity: 0, duration: 0.25, ease: "power2.out" }, 1.95);

      // Morph del botón al estado "¡Loopoints acreditados!" (t=2.12s -> sfx-chime-credit a 2.15s)
      tl.to("#r-confirm-btn", { y: -480, scaleY: 2.3, duration: 0.36, ease: "power2.inOut" }, 1.96);
      tl.to("#r-state-pending", { opacity: 0, duration: 0.04 }, 2.08);
      tl.fromTo("#r-state-done", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, 2.12);
      tl.fromTo("#r-done-header", { y: -30 }, { y: 0, duration: 0.35, ease: "expo.out" }, 2.12);

      // La moneda salta al espacio libre sobre el CTA sin tapar cifras

      tl.to("#r-coin", { rotation: 0, duration: 0.25, ease: "power2.out" }, 2.65);

      // Hold legible para el espectador hasta 5.0s, luego salida hacia la derecha
      tl.to("#r-copy", { opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, 5.05);
      tl.to("#r-phone", { x: -120, opacity: 0, duration: 0.4, ease: "power3.in" }, 5.15);

      // La moneda salta fuera por la derecha (t=5.25s -> sfx-whoosh-out a 5.3s)
